<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kitchen Story - Change Password</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>

<header class="admin-header">

    <h1>Kitchen Story Admin</h1>

    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="food-items.html">
            Food Items
        </a>

        <a href="orders.html">
            Orders
        </a>

        <a href="change-password.html">
            Change Password
        </a>

        <button id="logoutButton">
            Logout
        </button>

    </nav>

</header>


<main class="admin-container">

    <h2>
        Change Password
    </h2>


    <form
        id="changePasswordForm"
        class="admin-form"
    >

        <label for="currentPassword">
            Current Password
        </label>

        <input
            type="password"
            id="currentPassword"
            required
        >


        <label for="newPassword">
            New Password
        </label>

        <input
            type="password"
            id="newPassword"
            minlength="6"
            required
        >


        <label for="confirmPassword">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            minlength="6"
            required
        >


        <button type="submit">
            Change Password
        </button>

    </form>


    <p id="passwordMessage"></p>

</main>


<script>

const API_URL =
    "http://localhost:3000/api";


// ===============================
// AUTH CHECK
// ===============================

if (
    sessionStorage.getItem(
        "adminLoggedIn"
    ) !== "true"
) {

    window.location.href =
        "login.html";

}


// ===============================
// CHANGE PASSWORD
// ===============================

document
    .getElementById(
        "changePasswordForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const currentPassword =
                document.getElementById(
                    "currentPassword"
                ).value;


            const newPassword =
                document.getElementById(
                    "newPassword"
                ).value;


            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                ).value;


            const message =
                document.getElementById(
                    "passwordMessage"
                );


            if (
                newPassword !==
                confirmPassword
            ) {

                message.textContent =
                    "New passwords do not match.";

                message.style.color =
                    "red";

                return;

            }


            if (newPassword.length < 6) {

                message.textContent =
                    "New password must be at least 6 characters.";

                message.style.color =
                    "red";

                return;

            }


            const username =
                sessionStorage.getItem(
                    "adminUsername"
                );


            if (!username) {

                message.textContent =
                    "Admin session not found.";

                message.style.color =
                    "red";

                return;

            }


            message.textContent =
                "Updating password...";

            message.style.color =
                "black";


            try {

                const response =
                    await fetch(
                        `${API_URL}/admin/change-password`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                username,

                                currentPassword,

                                newPassword

                            })

                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message
                    );

                }


                message.textContent =
                    result.message;

                message.style.color =
                    "green";


                document
                    .getElementById(
                        "changePasswordForm"
                    )
                    .reset();


            } catch (error) {

                console.error(error);


                message.textContent =
                    error.message;

                message.style.color =
                    "red";

            }

        }
    );


// ===============================
// LOGOUT
// ===============================

document
    .getElementById(
        "logoutButton"
    )
    .addEventListener(
        "click",
        function() {

            sessionStorage.clear();

            window.location.href =
                "login.html";

        }
    );

</script>

</body>

</html>
