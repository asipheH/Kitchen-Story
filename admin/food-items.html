<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kitchen Story - Food Items</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

<header class="admin-header">

    <div>
        <h1>Kitchen Story</h1>
        <p>Food Item Management</p>
    </div>

    <button
        class="logout-button"
        onclick="logout()"
    >
        Logout
    </button>

</header>


<main class="food-management">

    <div class="page-header">

        <h2>Master Food Item List</h2>

        <button onclick="openAddForm()">
            + Add Food Item
        </button>

    </div>


    <!-- Add/Edit Form -->

    <div
        id="foodFormContainer"
        class="form-container"
        style="display: none;"
    >

        <h3 id="formTitle">
            Add Food Item
        </h3>

        <form id="foodForm">

            <input
                type="hidden"
                id="foodId"
            >

            <label>
                Food Name
            </label>

            <input
                type="text"
                id="foodName"
                placeholder="Enter food name"
                required
            >


            <label>
                Category
            </label>

            <input
                type="text"
                id="foodCategory"
                placeholder="Enter category"
                required
            >


            <label>
                Description
            </label>

            <input
                type="text"
                id="foodDescription"
                placeholder="Enter description"
                required
            >


            <label>
                Price
            </label>

            <input
                type="number"
                id="foodPrice"
                placeholder="Enter price"
                min="0"
                step="0.01"
                required
            >


            <label>
                Availability
            </label>

            <select id="foodAvailability">

                <option value="true">
                    Available
                </option>

                <option value="false">
                    Not Available
                </option>

            </select>


            <button type="submit">
                Save Food Item
            </button>

            <button
                type="button"
                class="cancel-button"
                onclick="closeForm()"
            >
                Cancel
            </button>

        </form>

    </div>


    <!-- Food Table -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Category</th>

                    <th>Price</th>

                    <th>Availability</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="foodTableBody">
            </tbody>

        </table>

    </div>

</main>


<script src="food-items.js"></script>

</body>

</html>
