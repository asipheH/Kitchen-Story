<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kitchen Story - Admin Login</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="login-container">

    <h1>Kitchen Story</h1>

    <h2>Admin Login</h2>

    <form id="loginForm">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

        <p id="loginMessage"></p>

    </form>

</div>

<script src="admin.js"></script>

</body>
</html>
